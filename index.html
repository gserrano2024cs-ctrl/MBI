<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Briceño hoy</title>
    <!-- Importando tipografía cursiva para el "hoy" y una moderna para el resto -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos generales */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f4f9; /* Fondo general detrás de las páginas flotantes */
            color: #333;
            scroll-behavior: smooth;
        }

        /* Logo en la esquina superior al frente de todo */
        .logo-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .logo-mbi { text-transform: uppercase; }
        .logo-hoy { text-transform: lowercase; font-family: 'Dancing Script', cursive; font-size: 1.5rem; color: #d35400; }

        /* Hero Section (Primera página) */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('URL_DE_TU_FONDO_AQUI') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }
        .hero h1 {
            font-size: 4rem;
            margin: 0;
        }
        .hero .cursiva {
            font-family: 'Dancing Script', cursive;
            color: #f1c40f; /* Color llamativo para el 'hoy' */
            font-size: 5rem;
            margin-left: 10px;
        }

        /* Contenedor de páginas flotantes */
        .floating-container {
            max-width: 1200px;
            margin: -50px auto 50px auto; /* Sube un poco para superponerse al hero */
            position: relative;
            z-index: 10;
            padding: 0 20px;
        }

        /* Estilo de la página flotante */
        .floating-page {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .floating-page h2 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* Carrusel de Trujillo (Scroll horizontal) */
        .carousel {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding-bottom: 20px;
            scroll-snap-type: x mandatory;
        }
        .carousel::-webkit-scrollbar { height: 8px; }
        .carousel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .carousel-item {
            min-width: 300px;
            height: 200px;
            background-color: #ddd;
            border-radius: 10px;
            scroll-snap-align: start;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            color: white;
            font-weight: bold;
            background-size: cover;
            background-position: center;
        }

        /* Sección de Shorts Videos */
        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .short-video {
            width: 100%;
            border-radius: 10px;
            aspect-ratio: 9/16; /* Formato vertical tipo Short/Reel */
            background: #000;
            object-fit: cover;
        }

        /* Logos de Universidades */
        .uni-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
        }
        .uni-logos img {
            max-width: 150px;
            filter: grayscale(100%); /* Efecto elegante en blanco y negro */
            transition: filter 0.3s ease;
        }
        .uni-logos img:hover {
            filter: grayscale(0%); /* Vuelve a color al pasar el cursor */
        }
    </style>
</head>
<body>

    <!-- Logo superior izquierdo -->
    <div class="logo-container">
        <!-- Puedes cambiar esto por una etiqueta <img> cuando cargues el logo real -->
        <span class="logo-mbi">MBI</span> <span class="logo-hoy">hoy</span>
    </div>

    <!-- Primera Página: Título Grande -->
    <section class="hero">
        <h1>Mario Briceño<span class="cursiva">hoy</span></h1>
    </section>

    <!-- Páginas Flotantes -->
    <div class="floating-container">
        
        <!-- Experiencias en Trujillo -->
        <section class="floating-page">
            <h2>Experiencias en Trujillo</h2>
            <p style="text-align: center; margin-bottom: 20px;">Años de labor, distribución y actividades comunitarias en el estado.</p>
            <div class="carousel">
                <!-- Reemplaza las URL por las rutas de tus fotos de Trujillo -->
                <div class="carousel-item" style="background-image: linear-gradient(transparent, rgba(0,0,0,0.8)), url('foto1.jpg');">Entrega de libros</div>
                <div class="carousel-item" style="background-image: linear-gradient(transparent, rgba(0,0,0,0.8)), url('foto2.jpg');">Actividad Comunitaria</div>
                <div class="carousel-item" style="background-image: linear-gradient(transparent, rgba(0,0,0,0.8)), url('foto3.jpg');">Distribución</div>
                <div class="carousel-item" style="background-image: linear-gradient(transparent, rgba(0,0,0,0.8)), url('foto4.jpg');">Talleres y lecturas</div>
            </div>
        </section>

        <!-- Shorts y Dinamismo -->
        <section class="floating-page">
            <h2>MBI en Movimiento</h2>
            <div class="shorts-grid">
                <!-- Etiquetas de video preparadas para formato vertical (Shorts) -->
                <video class="short-video" controls poster="poster1.jpg">
                    <source src="short1.mp4" type="video/mp4">
                    Tu navegador no soporta el formato de video.
                </video>
                <video class="short-video" controls poster="poster2.jpg">
                    <source src="short2.mp4" type="video/mp4">
                </video>
                <video class="short-video" controls poster="poster3.jpg">
                    <source src="short3.mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- Alianzas / Universidades -->
        <section class="floating-page">
            <h2>Universidades Aliadas</h2>
            <div class="uni-logos">
                <!-- Sustituye por los logos de las universidades correspondientes -->
                <img src="logo-uni1.png" alt="Universidad 1">
                <img src="logo-uni2.png" alt="Universidad 2">
                <img src="logo-uni3.png" alt="Universidad 3">
                <img src="logo-uni4.png" alt="Universidad 4">
            </div>
        </section>

    </div>

</body>
</html>
